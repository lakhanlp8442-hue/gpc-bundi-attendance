{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 bg-white">
            <h4 class="fw-bold mb-1">Faculty Registration</h4>
            <p class="text-muted small mb-4">GPC Bundi Teaching Staff Onboarding</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="full_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Employee / Faculty ID</label>
                    <input type="text" name="employee_id" class="form-control text-uppercase" placeholder="e.g. FAC101" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Self Mobile Number</label>
                    <input type="tel" name="mobile" pattern="[6-9][0-9]{9}" class="form-control" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Department / Branch</label>
                        <select name="branch" class="form-select">
                            <option value="CSE">Computer Science (CSE)</option>
                            <option value="ME">Mechanical (ME)</option>
                            <option value="EE">Electrical (EE)</option>
                            <option value="CE">Civil (CE)</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Designation</label>
                        <input type="text" name="designation" class="form-control" value="Lecturer" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-semibold">Register Faculty</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
